<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT Poster App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #ff007a;
            --bg-color: #0f0f13;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --secondary-text: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #2a1a3a, #0f0f13);
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff007a, #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .sub-header {
            color: var(--secondary-text);
            font-size: 14px;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary-color);
        }

        /* Platform Grid */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .platform-btn {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-direction: column;
            padding: 5px;
            color: white;
            font-weight: 500;
            font-size: 13px;
        }

        .platform-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }

        /* Discovery / Results View */
        .view-section {
            display: none;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .view-title {
            font-size: 18px;
            font-weight: bold;
        }

        .type-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid transparent;
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .toggle-btn.active {
            background: rgba(255, 0, 122, 0.2);
            color: white;
            border-color: var(--primary-color);
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .media-item {
            position: relative;
            aspect-ratio: 2/3;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: #222;
        }

        .media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 5px;
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Details View (Reused styles from tmdb.html simplified) */
        .details-header {
            margin-bottom: 15px;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
        }
        .meta-row { font-size: 13px; color: #ccc; margin-top: 4px; }

        .image-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .image-grid.backdrops { grid-template-columns: 1fr; }

        .img-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #222;
            display: flex;
            flex-direction: column;
        }
        .img-card img { width: 100%; height: auto; display: block; flex: 1; object-fit: cover; cursor: pointer; }

        .card-footer {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #1a1a1f;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .card-btn {
            flex: 1;
            border: none;
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn-send {
            background: var(--primary-color);
        }
        .btn-copy {
            background: rgba(255,255,255,0.1);
        }

        .loader {
            display: none;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .load-more {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            flex-direction: column;
        }

        .modal-content {
            width: 100%;
            max-width: 400px;
            background: #1a1a1f;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
        }

        .modal-image {
            width: 100%;
            display: block;
            max-height: 60vh;
            object-fit: contain;
            background: #000;
        }

        .modal-actions {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .btn-download {
            background: linear-gradient(90deg, #ff007a, #9900ff);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 122, 0.3);
        }

        .btn-copy {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            z-index: 10;
        }

    </style>
</head>
<body>
    <div class="container">

        <!-- HOME VIEW -->
        <div id="homeView">
            <div class="header">
                <div class="app-title">OTT Poster App</div>
                <div class="sub-header">Select a Platform</div>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search Movies/Series...">
            </div>

            <div class="platform-grid" id="platformGrid">
                <!-- Buttons will be injected here -->
            </div>
        </div>

        <!-- DISCOVERY VIEW -->
        <div id="discoveryView" class="view-section">
            <div class="nav-bar">
                <button class="back-btn" onclick="showHome()">← Back</button>
                <div class="view-title" id="discoveryTitle">Netflix</div>
            </div>

            <div class="type-toggle">
                <div class="toggle-btn active" onclick="setMediaType('movie')">Movies</div>
                <div class="toggle-btn" onclick="setMediaType('tv')">Series</div>
            </div>

            <div class="media-grid" id="mediaGrid"></div>
            <div id="discoLoader" class="loader"></div>
            <button id="loadMoreBtn" class="load-more" style="display:none" onclick="loadMore()">Load More</button>
        </div>

        <!-- DETAILS VIEW -->
        <div id="detailsView" class="view-section">
            <div class="nav-bar">
                <button class="back-btn" onclick="showDiscovery()">← Back</button>
                <div class="view-title">Posters & Backdrops</div>
            </div>

            <div class="details-header" id="movieMeta">
                <!-- Info injected here -->
            </div>

            <div class="type-toggle">
                <div class="toggle-btn active" id="tabPosters" onclick="setImageTab('posters')">Posters</div>
                <div class="toggle-btn" id="tabBackdrops" onclick="setImageTab('backdrops')">Backdrops</div>
            </div>

             <!-- Language Filter -->
            <div style="margin-bottom: 10px; overflow-x: auto; white-space: nowrap; padding-bottom: 5px;">
                 <select id="langSelect" onchange="filterImages()" style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); color: white; border: 1px solid #444; border-radius: 8px;">
                     <option value="all">All Languages</option>
                 </select>
            </div>

            <div class="image-grid" id="imageGrid"></div>
        </div>

    </div>

    <!-- IMAGE PREVIEW MODAL -->
    <div id="imageModal" class="modal-overlay" onclick="closeImagePreview(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeImagePreview()">×</button>
            <img id="previewImage" class="modal-image" src="" alt="Preview">
            <div class="modal-actions">
                <button class="action-btn btn-download" onclick="sendPreviewImage()">
                    <span>⬇</span> Download
                </button>
                <button class="action-btn btn-copy" onclick="copyPreviewLink()">
                    <span>❐</span> Copy Link
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const platforms = [
            { name: "Netflix", id: 8 },
            { name: "Amazon Prime", id: 119 },
            { name: "Disney+ Hotstar", id: 122 },
            { name: "JioHotstar", id: 2336 }, // Or 220
            { name: "Sony Liv", id: 237 },
            { name: "ZEE5", id: 232 },
            { name: "Apple TV+", id: 350 },
            { name: "MX Player", id: 284 },
            { name: "Sun NXT", id: 309 },
            { name: "Aha", id: 532 },
            { name: "BookMyShow", id: 121 },
            { name: "Crunchyroll", id: 283 },
            { name: "Plex", id: 538 },
            { name: "Lionsgate", id: 446 },
            { name: "Discovery+", id: 444 },
            { name: "Ullu", id: null },
            { name: "Atrangi", id: null },
            { name: "Shemaroo", id: 474 },
            { name: "Viki", id: 344 },
            { name: "iQIYI", id: 581 },
            { name: "Airtel Xtreme", id: null },
            { name: "Viva", id: null },
            { name: "Chaupal", id: null }
        ];

        // --- STATE ---
        let currentProvider = null;
        let currentMediaType = 'movie';
        let currentPage = 1;
        let isSearch = false;
        let currentSearchQuery = "";

        let currentDetails = null; // Stores data for details view
        let currentImageTab = 'posters';
        let currentPreviewUrl = "";

        // --- INIT ---
        function init() {
            const grid = document.getElementById('platformGrid');
            platforms.forEach(p => {
                const btn = document.createElement('div');
                btn.className = 'platform-btn';
                btn.innerText = p.name;
                btn.onclick = () => openProvider(p);
                grid.appendChild(btn);
            });

            // Search Listener
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    performSearch(e.target.value);
                }
            });
        }

        // --- NAVIGATION ---
        function showHome() {
            document.getElementById('homeView').style.display = 'block';
            document.getElementById('discoveryView').style.display = 'none';
            document.getElementById('detailsView').style.display = 'none';
        }

        function showDiscovery() {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('discoveryView').style.display = 'block';
            document.getElementById('detailsView').style.display = 'none';
        }

        function showDetails() {
            document.getElementById('discoveryView').style.display = 'none';
            document.getElementById('detailsView').style.display = 'block';
        }

        // --- DISCOVERY LOGIC ---
        function openProvider(platform) {
            if(!platform.id) {
                alert("This platform is not supported via API yet.");
                return;
            }
            currentProvider = platform;
            isSearch = false;
            currentMediaType = 'movie';
            currentPage = 1;
            document.getElementById('discoveryTitle').innerText = platform.name;
            document.getElementById('mediaGrid').innerHTML = '';

            showDiscovery();
            loadMedia();
        }

        function performSearch(query) {
            if(!query) return;
            isSearch = true;
            currentSearchQuery = query;
            currentPage = 1;
            document.getElementById('discoveryTitle').innerText = `Search: ${query}`;
            document.getElementById('mediaGrid').innerHTML = '';

            showDiscovery();
            loadMedia();
        }

        function setMediaType(type) {
            currentMediaType = type;
            currentPage = 1;
            document.getElementById('mediaGrid').innerHTML = '';

            // Update UI
            document.querySelectorAll('.type-toggle .toggle-btn').forEach(b => b.classList.remove('active'));
            if(type === 'movie') document.querySelector('.type-toggle .toggle-btn:nth-child(1)').classList.add('active');
            else document.querySelector('.type-toggle .toggle-btn:nth-child(2)').classList.add('active');

            loadMedia();
        }

        async function loadMedia() {
            const loader = document.getElementById('discoLoader');
            const btn = document.getElementById('loadMoreBtn');
            loader.style.display = 'block';
            btn.style.display = 'none';

            try {
                let url = '';
                if(isSearch) {
                    url = `/api/tmdb/search?query=${encodeURIComponent(currentSearchQuery)}&page=${currentPage}`;
                } else {
                    url = `/api/tmdb/discover?type=${currentMediaType}&with_watch_providers=${currentProvider.id}&page=${currentPage}&watch_region=IN`;
                }

                const res = await fetch(url);
                const data = await res.json();

                if(data.results) {
                    renderMedia(data.results);
                    if(data.page < data.total_pages) {
                        btn.style.display = 'block';
                    }
                }
            } catch(e) {
                console.error(e);
                alert("Error loading content");
            } finally {
                loader.style.display = 'none';
            }
        }

        function loadMore() {
            currentPage++;
            loadMedia();
        }

        function renderMedia(items) {
            const grid = document.getElementById('mediaGrid');
            const baseImg = window.location.origin + "/api/img?size=w342&path=";

            items.forEach(item => {
                if(!item.poster_path) return;

                // Filter media type for search results mixed list
                if(isSearch && item.media_type && item.media_type !== currentMediaType) return; // Simple filter

                const div = document.createElement('div');
                div.className = 'media-item';
                div.onclick = () => openDetails(item.id, item.media_type || currentMediaType);

                const img = document.createElement('img');
                img.src = baseImg + item.poster_path;
                img.loading = "lazy";

                const title = document.createElement('div');
                title.className = 'media-title';
                title.innerText = item.title || item.name;

                div.appendChild(img);
                div.appendChild(title);
                grid.appendChild(div);
            });
        }

        // --- DETAILS LOGIC ---
        async function openDetails(id, type) {
            showDetails();
            document.getElementById('imageGrid').innerHTML = '<div class="loader" style="display:block"></div>';
            document.getElementById('movieMeta').innerHTML = 'Loading...';

            try {
                // Fetch images
                const res = await fetch(`/api/tmdb/images?id=${id}&type=${type}&language=all`);
                const data = await res.json();

                if(data.error) throw new Error(data.error);

                // Store data
                currentDetails = {
                    id: id,
                    type: type,
                    posters: data.posters || [],
                    backdrops: data.backdrops || []
                };

                document.getElementById('movieMeta').innerHTML = `<div style="font-weight:bold; font-size:16px;">Images for ID: ${id}</div>`;

                // Render Images
                populateLangFilter();
                renderImages();

            } catch(e) {
                console.error(e);
                document.getElementById('movieMeta').innerText = "Error loading details.";
            }
        }

        function setImageTab(tab) {
            currentImageTab = tab;
            document.getElementById('tabPosters').classList.toggle('active', tab === 'posters');
            document.getElementById('tabBackdrops').classList.toggle('active', tab === 'backdrops');

            populateLangFilter();
            renderImages();
        }

        function populateLangFilter() {
            const select = document.getElementById('langSelect');
            select.innerHTML = '<option value="all">All Languages</option>';

            const list = currentImageTab === 'posters' ? currentDetails.posters : currentDetails.backdrops;
            const langs = {};

            list.forEach(img => {
                const l = img.iso_639_1 || 'null';
                langs[l] = (langs[l] || 0) + 1;
            });

            for(const [lang, count] of Object.entries(langs)) {
                const opt = document.createElement('option');
                opt.value = lang;
                let label = lang === 'null' ? 'No Language' : lang.toUpperCase();
                opt.innerText = `${label} (${count})`;
                select.appendChild(opt);
            }
        }

        function filterImages() {
            renderImages();
        }

        function renderImages() {
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '';

            if(currentImageTab === 'backdrops') grid.classList.add('backdrops');
            else grid.classList.remove('backdrops');

            const list = currentImageTab === 'posters' ? currentDetails.posters : currentDetails.backdrops;
            const lang = document.getElementById('langSelect').value;
            const baseImg = window.location.origin + "/api/img?size=original&path=";

            list.forEach(img => {
                const imgLang = img.iso_639_1 || 'null';
                if(lang !== 'all' && imgLang !== lang) return;

                const fullUrl = baseImg + img.file_path;

                const div = document.createElement('div');
                div.className = 'img-card';

                // Image Container
                const image = document.createElement('img');
                image.src = fullUrl;
                image.loading = "lazy";
                image.onclick = () => openImagePreview(fullUrl);

                // Action Footer
                const footer = document.createElement('div');
                footer.className = 'card-footer';

                const sendBtn = document.createElement('button');
                sendBtn.className = 'card-btn btn-send';
                sendBtn.innerHTML = '<span>⬇</span> Send';
                sendBtn.onclick = (e) => { e.stopPropagation(); sendImage(fullUrl); };

                const copyBtn = document.createElement('button');
                copyBtn.className = 'card-btn btn-copy';
                copyBtn.innerHTML = '<span>❐</span> Copy';
                copyBtn.onclick = (e) => { e.stopPropagation(); copyLink(fullUrl); };

                footer.appendChild(sendBtn);
                footer.appendChild(copyBtn);

                div.appendChild(image);
                div.appendChild(footer);
                grid.appendChild(div);
            });
        }

        // --- ACTIONS ---
        function sendImage(url) {
            if(!url) return;
            fetch('/api/tmdb/send_image', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    initData: Telegram.WebApp.initData,
                    url: url,
                    title: "Image"
                })
            }).then(() => {
                Telegram.WebApp.showPopup({message: "Image sent to chat!"});
            }).catch(e => {
                console.error(e);
                Telegram.WebApp.showPopup({message: "Failed to send."});
            });
        }

        function copyLink(url) {
            if(!url) return;
            navigator.clipboard.writeText(url).then(() => {
                Telegram.WebApp.showPopup({message: "Link copied!"});
            }).catch(err => {
                console.error('Failed to copy: ', err);
                Telegram.WebApp.showPopup({message: "Failed to copy."});
            });
        }

        // --- PREVIEW MODAL LOGIC ---
        function openImagePreview(url) {
            currentPreviewUrl = url;
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('previewImage');

            img.src = url;
            modal.style.display = 'flex';
        }

        function closeImagePreview(e) {
            if (e && e.target !== e.currentTarget) return; // Allow clicking on overlay to close
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
        }

        function sendPreviewImage() {
            sendImage(currentPreviewUrl);
        }

        function copyPreviewLink() {
            copyLink(currentPreviewUrl);
        }

        init();
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

    </script>
</body>
</html>
