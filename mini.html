<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝖣𝖾𝖾𝗇𝖽𝖺𝗒𝖺𝗅 𝖽𝗁𝖺𝗄𝖺𝖽</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      max-width: 100vw;
      overflow-x: hidden;
      /* Modern Deep Gradient Background */
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      transition: background 0.5s ease;
    }

    /* Fixed Top Heading */
    .top-heading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: white;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    /* Navigation Bar */
    .navbar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      padding: 15px 0;
      z-index: 999;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-btn {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      padding: 10px 25px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      border-radius: 30px;
      margin: 0 8px;

      /* Premium Glow Transparent Glass */
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
      color: #fff;
    }

    /* Main Box / Card */
    #box {
      width: 320px;
      background: rgba(255, 255, 255, 0.05); /* Transparent Glass */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

      position: relative;
      margin-top: 140px; /* Space for fixed headers */
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Animated Border Glow */
    #box::before {
      content: "";
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, #00f260, #0575e6, #8e2de2, #4a00e0);
      z-index: -1;
      border-radius: 22px;
      background-size: 400%;
      animation: glowing 20s linear infinite;
      filter: blur(20px);
      opacity: 0.6;
    }

    @keyframes glowing {
      0% { background-position: 0 0; }
      50% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }

    /* Header Row for Toggles */
    .header-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
      align-items: center;
      position: relative;
      z-index: 2; /* Ensure controls are above box glow */
    }

    /* Common Toggle Wrapper Style */
    .toggle-wrapper {
        position: relative;
        width: 60px;
        height: 30px;
    }

    /* Common Toggle Switch Style */
    .glass-switch {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5px;
      position: relative;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      z-index: 1;
    }

    .glass-switch:hover {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.8);
    }

    /* Common Toggle Ball */
    .toggle-ball {
      width: 24px;
      height: 24px;
      background: #fff;
      position: absolute;
      border-radius: 50%;
      transition: transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      z-index: 2;
    }

    /* --- Audio Toggle Specifics --- */
    .toggle-input1 { display: none; }

    .audio-toggle .toggle-ball {
        left: 3px; /* Default (Unchecked) = Left */
    }

    /* When Checked (Playing): Move Ball Right */
    .toggle-input1:checked + .audio-toggle .toggle-ball {
        transform: translateX(30px);
    }

    .toggle-input1:checked + .audio-toggle {
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .audio-icon {
        font-size: 12px;
        z-index: 1;
        text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    /* Left Icon (Pause) - Visible when Checked (Ball Right) */
    .fa-pause { color: #e74c3c; margin-left: 4px; }
    /* Right Icon (Play) - Visible when Unchecked (Ball Left) */
    .fa-play { color: #2ecc71; margin-right: 4px; }


    /* --- Theme Toggle Specifics --- */
    .theme-toggle .toggle-ball {
        right: 3px; /* Default (Dark) = Right */
    }

    .theme-icon {
        font-size: 12px;
        z-index: 1;
        text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    .fa-moon { color: #f1c40f; margin-left: 5px;}
    .fa-sun { color: #f39c12; margin-right: 5px;}

    /* Light Mode Overrides */
    body.light-mode {
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      color: #333;
    }

    /* Move Theme Ball Left in Light Mode */
    body.light-mode .theme-toggle .toggle-ball {
      transform: translateX(-30px);
      background: #333;
    }

    body.light-mode .top-heading,
    body.light-mode .navbar {
        background: rgba(255, 255, 255, 0.6);
        color: #333;
        border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    body.light-mode .nav-btn {
        color: #333;
        background: rgba(255,255,255, 0.5);
        border-color: rgba(0,0,0,0.1);
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    body.light-mode #box {
      background: rgba(255, 255, 255, 0.4);
      color: #333;
      border-color: rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
    }
    
    body.light-mode .glass-switch {
        background: rgba(255,255,255,0.8);
        border-color: rgba(0,0,0,0.1);
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    /* Image */
    .rounded-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
      transition: transform 0.5s;
      position: relative;
      z-index: 2;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-animation {
      animation: spin 8s linear infinite;
    }

    /* Text */
    .text {
      position: relative;
      z-index: 2;
    }
    .text h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .text h4 {
      font-size: 16px;
      font-weight: 300;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    /* Social Icons */
    .social-icons {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      text-decoration: none;

      /* Premium Glow Transparent Glass */
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .social-btn:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.8);
    }

    .social-btn.telegram:hover { background: #0088cc; border-color: #0088cc; }
    .social-btn.instagram:hover { background: #e4405f; border-color: #e4405f; }
    .social-btn.github:hover { background: #333; border-color: #fff; }
    .social-btn.youtube:hover { background: #ff0000; border-color: #ff0000; }

    /* Date Time */
    #datetime {
      font-size: 14px;
      font-weight: 500;
      padding: 10px 25px;
      /* Premium Glow Transparent Glass */
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 2;
    }

    /* Responsive */
    @media (max-width: 400px) {
      #box { width: 90%; margin-top: 130px; }
      .top-heading { font-size: 20px; }
      .rounded-img { width: 120px; height: 120px; }
    }
  </style>
</head>
<body>

  <!-- Fixed Heading -->
  <div class="top-heading">
    𝖣𝖾𝖾𝗇𝖽𝖺𝗒𝖺𝗅 𝖽𝗁𝖺𝗄𝖺𝖽
  </div>

  <!-- Navigation -->
  <div class="navbar">
    <a href="https://grateful-camel-atulraj-792f6f44.koyeb.app/mini#" class="nav-btn">Home</a>
    <a href="https://t.me/Deendayal_Hindi_Movies" class="nav-btn">Contact</a>
    <a href="#" class="nav-btn">Support</a>
  </div>

  <!-- Main Glass Card -->
  <div id="box">
    
    <!-- Header Row: Audio & Theme Toggles -->
    <div class="header-row">
        <!-- Audio Toggle (Redesigned as Pill Switch) -->
        <div class="toggle-wrapper">
            <input type="checkbox" id="toggle" class="toggle-input1">
            <label for="toggle" class="glass-switch audio-toggle">
                <i class="fas fa-pause audio-icon"></i>
                <i class="fas fa-play audio-icon"></i>
                <div class="toggle-ball"></div>
            </label>
        </div>

        <!-- Theme Toggle -->
        <div class="toggle-wrapper" onclick="toggleTheme()">
            <div class="glass-switch theme-toggle">
                <i class="fas fa-moon theme-icon"></i>
                <i class="fas fa-sun theme-icon"></i>
                <div class="toggle-ball"></div>
            </div>
        </div>
    </div>

    <!-- Image -->
    <img src="https://files.catbox.moe/pxwoxs.jpg" alt="Profile" class="rounded-img"/>

    <!-- Text -->
    <div class="text">
      <h1>प्रेमानंद महाराज</h1>
      <h4>राधा । कृष्ण</h4>
    </div>

    <!-- Social Links -->
    <div class="social-icons">
      <a href="https://t.me/Deendayal_Hindi_Movies" class="social-btn telegram" target="_blank"><i class="fab fa-telegram-plane"></i></a>
      <a href="https://youtube.com/" class="social-btn instagram" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://github.com/" class="social-btn github" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://youtube.com/" class="social-btn youtube" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>

    <!-- DateTime -->
    <div id="datetime">Loading...</div>

  </div>

  <script>
    // Date Time Logic
    function updateDateTime() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const date = now.toLocaleDateString('en-US', options);
      const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('datetime').textContent = `${date} • ${time}`;
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);

    // Theme Logic
    function toggleTheme() {
      document.body.classList.toggle("light-mode");
    }

    // Audio Logic
    document.addEventListener("DOMContentLoaded", () => {
        const audio = new Audio("https://files.catbox.moe/civ64k.mp3");
        const toggle = document.getElementById("toggle");
        const img = document.querySelector(".rounded-img");

        toggle.addEventListener("change", () => {
            if (toggle.checked) {
                audio.play().catch(e => console.log("Audio play error:", e));
                img.classList.add("spin-animation");
            } else {
                audio.pause();
                audio.currentTime = 0;
                img.classList.remove("spin-animation");
            }
        });
    });
  </script>
</body>
</html>
